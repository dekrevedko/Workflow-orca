name: Quarantined lease confirmation race

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lease-confirmation-race.yml'
      - 'verification/tla/lease-confirmation-race/**'
      - 'verification/tla/toolchain.json'
      - 'scripts/verification/**'
      - 'openspec/specs/durable-runtime/**'
      - 'openspec/specs/management-and-querying/**'
      - 'docs/specs/17-selected-mode-capability-matrix.md'
      - 'src/OrcaCore.Abstractions/**'
      - 'src/OrcaCore.Core/**'
      - 'src/OrcaCore.Engine.Durable/**'
      - 'src/OrcaCore.Runtime.Protocol/**'
      - 'src/OrcaCore.Durable.Hosting/**'
      - 'src/OrcaCore.Provider.Abstractions/**'
      - 'src/OrcaCore.Providers.PostgreSql/**'
      - 'src/OrcaCore.Providers.SqlServer/**'
      - 'tests/OrcaCore.Hosting.Tests/LeaseConfirmationRaceTests*'
      - 'Directory.*'
      - 'global.json'
  push:
    branches: [master]
    paths:
      - '.github/workflows/lease-confirmation-race.yml'
      - 'verification/tla/lease-confirmation-race/**'
      - 'verification/tla/toolchain.json'
      - 'scripts/verification/**'
      - 'openspec/specs/durable-runtime/**'
      - 'openspec/specs/management-and-querying/**'
      - 'docs/specs/17-selected-mode-capability-matrix.md'
      - 'src/OrcaCore.Abstractions/**'
      - 'src/OrcaCore.Core/**'
      - 'src/OrcaCore.Engine.Durable/**'
      - 'src/OrcaCore.Runtime.Protocol/**'
      - 'src/OrcaCore.Durable.Hosting/**'
      - 'src/OrcaCore.Provider.Abstractions/**'
      - 'src/OrcaCore.Providers.PostgreSql/**'
      - 'src/OrcaCore.Providers.SqlServer/**'
      - 'tests/OrcaCore.Hosting.Tests/LeaseConfirmationRaceTests*'
      - 'Directory.*'
      - 'global.json'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check confirmation identity and waiter grants with private Java
        shell: pwsh
        run: ./scripts/verification/Invoke-TlaModelCheck.ps1 -ModelDirectory verification/tla/lease-confirmation-race -ModuleName LeaseConfirmationRace -CheckLivenessAtEnd -OutputDirectory .codex-run/confirmation-model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lease-confirmation-model
          include-hidden-files: true
          path: |
            .codex-run/confirmation-model/*.json
            .codex-run/confirmation-model/*/tlc.log
            .codex-run/confirmation-model/*/*.cfg
            .codex-run/confirmation-model/*/*.tla

  database-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql, SqlServer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Kill the first confirmer before workflow publication
        shell: pwsh
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          $method = "OrcaCore.Hosting.Tests.LeaseConfirmationRaceTests.$($env:PROVIDER)ProcessRestart"
          dotnet run --project tests/OrcaCore.Hosting.Tests -c Release -- -explicit only -method $method -showLiveOutput -xml restart.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cases = @(([xml](Get-Content -Raw restart.xml)).SelectNodes('//test'))
          $expectedNames = @(
            "${method}(stale: True, keepWinnerAlive: False)"
            "${method}(stale: False, keepWinnerAlive: False)"
            "${method}(stale: True, keepWinnerAlive: True)"
          )
          if ($cases.Count -ne $expectedNames.Count) { throw "Expected three confirmation schedules for $method." }
          foreach ($name in $expectedNames) {
            if (@($cases | Where-Object { $_.name -ceq $name -and $_.result -ceq 'Pass' }).Count -ne 1) {
              throw "Missing passing test $name."
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lease-confirmation-${{ matrix.provider }}
          path: restart.xml
          if-no-files-found: error
