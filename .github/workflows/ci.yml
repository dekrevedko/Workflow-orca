name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: v3-gpt/global.json

      - name: Restore
        run: dotnet restore v3-gpt/OrcaCore.slnx

      - name: Build
        run: dotnet build v3-gpt/OrcaCore.slnx --no-restore -c Release

      - name: Build benchmarks
        run: dotnet build v3-gpt/benchmarks/OrcaCore.Benchmarks/OrcaCore.Benchmarks.csproj --no-restore -c Release

      - name: Test
        run: dotnet test v3-gpt/OrcaCore.slnx --no-build -c Release --verbosity normal
