name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OrcaCore.slnx

      - name: Build
        run: dotnet build OrcaCore.slnx --no-restore -c Release -warnaserror

      - name: Build benchmarks
        run: dotnet build benchmarks/OrcaCore.Benchmarks/OrcaCore.Benchmarks.csproj --no-restore -c Release

      - name: Unit tests with coverage
        run: >
          dotnet test
          tests/OrcaCore.Core.Tests/OrcaCore.Core.Tests.csproj
          --no-build -c Release --logger trx
          --collect:"XPlat Code Coverage" --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Engine.Ephemeral.Tests/OrcaCore.Engine.Ephemeral.Tests.csproj
          --no-build -c Release --logger trx
          --collect:"XPlat Code Coverage" --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Engine.Durable.Tests/OrcaCore.Engine.Durable.Tests.csproj
          --no-build -c Release --logger trx
          --collect:"XPlat Code Coverage" --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Acceptance.Tests/OrcaCore.Acceptance.Tests.csproj
          --no-build -c Release --logger trx
          --collect:"XPlat Code Coverage" --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Hosting.Tests/OrcaCore.Hosting.Tests.csproj
          --no-build -c Release --logger trx
          --collect:"XPlat Code Coverage" --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.ProviderCertification/OrcaCore.ProviderCertification.csproj
          --no-build -c Release --logger trx
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Infrastructure contract guards
        run: >
          dotnet test
          tests/OrcaCore.DeveloperSurface.Guards/OrcaCore.DeveloperSurface.Guards.csproj
          --no-build --no-restore -c Release
          --filter "Disposition=Infrastructure"
          --logger trx --results-directory TestResults

      - name: Authoring lifecycle requirement evidence
        run: >
          dotnet test
          tests/OrcaCore.Core.Tests/OrcaCore.Core.Tests.csproj
          --no-build --no-restore -c Release
          --filter "Requirement=CR-009a"
          --logger trx --results-directory TestResults

      - name: Failure provenance requirement evidence
        run: >
          dotnet test
          tests/OrcaCore.Core.Tests/OrcaCore.Core.Tests.csproj
          --no-build --no-restore -c Release
          --filter "Requirement=CR-014a"
          --logger trx --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Engine.Ephemeral.Tests/OrcaCore.Engine.Ephemeral.Tests.csproj
          --no-build --no-restore -c Release
          --filter "Requirement=CR-014a"
          --logger trx --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Engine.Durable.Tests/OrcaCore.Engine.Durable.Tests.csproj
          --no-build --no-restore -c Release
          --filter "Requirement=CR-014a"
          --logger trx --results-directory TestResults

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate core engine coverage report
        run: ~/.dotnet/tools/reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"TestResults/CoverageReport" -reporttypes:"Cobertura;MarkdownSummaryGithub" -assemblyfilters:"+OrcaCore.Engine.*"

      - name: Enforce core engine coverage baseline
        shell: pwsh
        env:
          MIN_CORE_ENGINE_LINE_RATE: "0.80"
        run: |
          [xml]$coverage = Get-Content "TestResults/CoverageReport/Cobertura.xml"
          $lineRate = [double]$coverage.coverage.'line-rate'
          $minimum = [double]$env:MIN_CORE_ENGINE_LINE_RATE
          if ($lineRate -lt $minimum) {
            throw "Core engine line coverage $lineRate is below baseline $minimum."
          }

      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: TestResults

  providers:
    name: container + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OrcaCore.slnx

      - name: Build
        run: dotnet build OrcaCore.slnx --no-restore -c Release

      - name: Provider and integration tests
        run: >
          dotnet test
          tests/OrcaCore.Providers.PostgreSql.Tests/OrcaCore.Providers.PostgreSql.Tests.csproj
          --no-build -c Release --logger trx --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Providers.SqlServer.Tests/OrcaCore.Providers.SqlServer.Tests.csproj
          --no-build -c Release --logger trx --results-directory TestResults &&
          dotnet test
          tests/OrcaCore.Integration.Tests/OrcaCore.Integration.Tests.csproj
          --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-results
          path: TestResults
