name: Native package support qualification

on:
  workflow_dispatch:
    inputs:
      package-version:
        description: Prerelease package version to qualify
        type: string
        default: 0.0.0-phase0
      run-ci:
        description: Qualify the exact twelve-package artifact produced by full CI
        type: boolean
        default: false
      existing-release:
        description: Qualify existing immutable release assets without rebuilding packages
        type: boolean
        default: false
  workflow_call:
    outputs:
      qualified:
        description: True only after all six native records pass
        value: ${{ jobs.records.outputs.qualified }}
    inputs:
      package-version:
        type: string
        default: 0.0.0-phase0
      run-ci:
        type: boolean
        default: false
      existing-feed-artifact:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ephemeral-native-support-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ inputs.run-ci == true }}
    uses: ./.github/workflows/ci.yml
    with:
      package-version: ${{ inputs.package-version }}

  packages:
    name: One exact candidate feed
    needs: ci
    if: ${{ always() && !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: windows-2025
    env:
      PACKAGE_VERSION: ${{ inputs.package-version }}
      EXISTING_FEED: ${{ inputs.existing-feed-artifact || (inputs.run-ci && 'orcacore-packages') || '' }}
      EXISTING_RELEASE: ${{ inputs.existing-release || false }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Download and verify existing immutable release assets
        if: env.EXISTING_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:EXISTING_FEED) { throw 'Existing-release qualification cannot also build or consume a CI feed' }
          $tag = "v$env:PACKAGE_VERSION"
          $release = & gh release view $tag --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -cne $tag -or $release.isDraft -or -not $release.isPrerelease) { throw 'Expected an existing published prerelease' }
          & gh release download $tag --dir artifacts/native-candidate-feed --pattern '*.nupkg' --pattern SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download release assets' }
          $sourceCommit = & git rev-parse "$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve release source' }
          & git diff --exit-code $sourceCommit HEAD -- src global.json Directory.Build.props Directory.Build.targets Directory.Packages.props NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'Qualification source/build inputs differ from the release' }
          ./eng/Test-ReleasePackages.ps1 -Version $env:PACKAGE_VERSION -SourceCommit $sourceCommit -PackageDirectory artifacts/native-candidate-feed
      - uses: actions/download-artifact@v4
        if: env.EXISTING_FEED != ''
        with:
          name: ${{ env.EXISTING_FEED }}
          path: artifacts/native-candidate-feed
      - name: Verify the exact existing CI feed
        if: env.EXISTING_FEED != ''
        shell: pwsh
        run: ./eng/Test-ReleasePackages.ps1 -Version $env:PACKAGE_VERSION -SourceCommit '${{ github.sha }}' -PackageDirectory artifacts/native-candidate-feed
      - name: Build and pack the exact source once
        if: env.EXISTING_FEED == '' && env.EXISTING_RELEASE != 'true'
        shell: pwsh
        run: |
          dotnet build OrcaCore.slnx -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source build failed' }
          if ($env:PACKAGE_VERSION -eq '0.0.0-phase0') {
            ./tests/OrcaCore.DeveloperSurface.Guards/pack-exact-package-feed.ps1 -NoBuild -OutputDirectory "${{ github.workspace }}/artifacts/native-candidate-feed"
          } else {
            ./eng/Pack-Packages.ps1 -NoBuild -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/native-candidate-feed
          }
      - uses: actions/upload-artifact@v4
        with:
          name: issue-13-candidate-feed
          path: artifacts/native-candidate-feed/*.nupkg
          if-no-files-found: error

  native:
    name: Native ${{ matrix.os }} ${{ matrix.flavor }}
    needs: packages
    if: ${{ always() && !cancelled() && needs.packages.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        flavor: [jit, trimmed, aot]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: issue-13-candidate-feed
          path: ${{ runner.temp }}/issue-13-feed
      - name: Ubuntu Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Negative gate controls
        run: python -B -X utf8 -m unittest discover -s tools/ephemeral-native-assessment/support_v2 -p 'test_*gate.py'
      - name: Publish and execute native package consumers
        shell: pwsh
        run: |
          python -B -X utf8 tools/ephemeral-native-assessment/support_v2/run_support.py --repository "${{ github.workspace }}" --feed "${{ runner.temp }}/issue-13-feed" --work "${{ runner.temp }}/issue-13-work" --output "${{ runner.temp }}/issue-13-evidence" --flavor "${{ matrix.flavor }}" --package-version "${{ inputs.package-version }}"
          if ($LASTEXITCODE -ne 0) { throw 'Native support evidence is incomplete, failed or unclassified' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-13-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ runner.temp }}/issue-13-evidence
          if-no-files-found: error
      - name: Remove only the owned disposable consumer work
        if: always()
        shell: pwsh
        run: |
          $supportWork = Join-Path $env:RUNNER_TEMP 'issue-13-work'
          if (Test-Path -LiteralPath $supportWork) {
            $resolvedWork = (Resolve-Path -LiteralPath $supportWork).Path
            $expectedWork = [IO.Path]::GetFullPath($supportWork)
            if ($resolvedWork -cne $expectedWork) { throw 'Unexpected cleanup target' }
            $marker = Join-Path $resolvedWork '.owned-issue-13-support'
            if ((Get-Content -LiteralPath $marker -Raw).Trim() -cne 'disposable support-v2 work') { throw 'Unowned cleanup target' }
            Remove-Item -LiteralPath $resolvedWork -Recurse -Force
          }

  records:
    name: Six native cells bind the same source and packages
    needs: native
    if: ${{ always() && !cancelled() && needs.native.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      qualified: ${{ steps.gate.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: issue-13-*
          path: evidence
      - id: gate
        run: |
          python -B -X utf8 tools/ephemeral-native-assessment/support_v2/support_gate.py --package-version "${{ inputs.package-version }}" evidence
          echo 'qualified=true' >> "$GITHUB_OUTPUT"
